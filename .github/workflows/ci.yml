name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0 # compatibility floor
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- tests/mcp/stdio.test.ts
      - name: Assert no generated or repository residue
        run: |
          git diff --check
          test ! -e results
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # `evidence:verify` accepts the attested commit itself OR one later commit whose sole
          # change is the attestation. Proving the second case reads the attested commit object,
          # its tree, and the diff to HEAD, none of which exist in the default depth-1 checkout —
          # so every push landing on an evidence commit failed here with a stale exit 2. Two
          # commits is exactly what that contract can require.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # current patched Node 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run evidence:verify
      - name: Assert no generated or repository residue
        run: |
          git diff --check
          test ! -e results
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  protocol:
    needs: [compatibility-floor, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # current patched Node 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:conformance
      - name: Assert no generated or repository residue
        run: |
          git diff --check
          test ! -e results
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
